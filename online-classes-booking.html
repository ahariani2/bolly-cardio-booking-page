<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  /* 1. Global Reset & Shared Layout */
  body, html { margin: 0; padding: 0; overflow: hidden; background: transparent; min-height: 900px; }
  
  :root {
    --bg-white: #ffffff;
    --dark-magenta: #8b004b;
    --header-pink: #ffdef0;
    --bright-pink: #e4007c;
    --muted-magenta: #9f2c6b;
    --white: #ffffff;
    /* Online Palette */
    --online-orange: #ff8c42;
    --online-bg: #fffbf7;
    --online-header: #ffe8d6;
  }

  .bolly-hub {
    font-family: 'Quicksand', sans-serif;
    max-width: 550px;
    margin: 0 auto;
    text-align: center;
    background-color: var(--bg-white);
    padding: 20px 20px 100px 20px; 
    border-radius: 20px;
  }

  .hub-header h2 { font-size: 1.8rem; margin-bottom: 8px; font-weight: 700; color: #333; }
  .stepper-container { display: flex; align-items: center; justify-content: center; margin-bottom: 30px; }
  .stepper { display: flex; align-items: center; background: var(--bright-pink); padding: 4px 6px; border-radius: 50px; color: white; gap: 6px; }
  .step-btn { background: none; border: none; color: white; font-size: 1rem; cursor: pointer; }

  /* 2. Card Components (Studio Default) */
  .class-card {
    background: var(--white); border-radius: 12px; margin-bottom: 25px;
    overflow: hidden; border: 1px solid var(--header-pink);
    box-shadow: 0 4px 12px rgba(139, 0, 75, 0.05); text-align: left;
  }
  .card-header { background-color: var(--header-pink); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
  .card-header .date-text { color: var(--dark-magenta); font-weight: 700; font-size: 1.1rem; }
  .card-content { display: flex; padding: 20px; justify-content: space-between; align-items: center; }
  
  /* 3. Online Overrides */
  .class-card.online { background: var(--online-bg); border-color: var(--online-header); }
  .class-card.online .card-header { background-color: var(--online-header); }
  .class-card.online .date-text { color: #a6511d; }
  .class-card.online .theme-title { color: var(--online-orange); }
  .class-card.online .book-btn { background: var(--online-orange); }

  .theme-title { color: var(--bright-pink); font-weight: 700; text-transform: uppercase; font-size: 0.85rem; display: block; margin-bottom: 8px; }
  .info-line { font-size: 0.9rem; color: #444; margin-bottom: 4px; display: block; }
  .location-line { font-size: 0.85rem; color: #666; margin-top: 8px; display: block; text-decoration: none; cursor: pointer; transition: 0.2s; }
  .location-line:hover { text-decoration: underline; color: var(--muted-magenta); }
  .class-card.online .location-line:hover { color: var(--online-orange); }

  .book-btn { background: var(--muted-magenta); color: white !important; text-decoration: none; padding: 10px 18px; border-radius: 4px; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
  .book-btn.sold-out { background: #fdf0f7 !important; color: #d4a5bc !important; pointer-events: none; border: 1px solid #f3d4e4; }
  .class-card.online .book-btn.sold-out { background: #fff3eb !important; color: #eec4a8 !important; border-color: #ffe8d6; }

  /* 4. Modal & Utils */
  .info-icon-svg { width: 18px; height: 18px; cursor: pointer; fill: var(--online-orange); vertical-align: middle; margin-left: 6px; }
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-content { background: white; width: 90%; max-width: 480px; border-radius: 20px; padding: 30px; position: relative; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.3); font-family: 'Quicksand', sans-serif; }
  .modal-close { position: absolute; top: 15px; right: 20px; font-size: 1.8rem; cursor: pointer; color: #bbb; }
  .modal-img { width: 100%; border-radius: 12px; margin-bottom: 20px; display: block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  .youtube-cta { font-size: 0.85rem; color: #666; margin-top: 35px; line-height: 1.5; }
</style>

<div class="bolly-hub">
  <div class="hub-header">
    <h2 id="hub-title">Bolly Cardio with Arushi</h2>
    <div class="stepper-container">
      <span style="font-size: 0.9rem; font-weight: 700; margin-right: 10px;">Quantity</span>
      <div class="stepper" id="stepper-ui">
        <button class="step-btn" onclick="changeQty(-1)">−</button>
        <span id="qty-val">1</span>
        <button class="step-btn" onclick="changeQty(1)">+</button>
      </div>
    </div>
  </div>
  
  <div id="class-list"></div>

  <div class="youtube-cta">
    Can't wait for class? Try our <a href="https://www.youtube.com/watch?v=_2mkL_mWItA&utm_source=bolly_hub" target="_blank" style="color:var(--muted-magenta); font-weight:700; text-decoration:none;">10-min YouTube workout</a> now!
  </div>
</div>

<div id="infoModal" class="modal-overlay" onclick="closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <span class="modal-close" onclick="closeModal()">×</span>
    <div style="color:var(--online-orange); font-weight:700; margin-bottom:15px; font-size:1.2rem;">ℹ️ Online Class Details</div>
    <div class="modal-body">
      <img src="http://googleusercontent.com/profile/picture/1" class="modal-img" alt="Preview">
      <p style="font-size:0.9rem; line-height:1.5; color:#444;">Experience the high-energy vibe from home! Live, interactive sessions for all levels.</p>
    </div>
  </div>
</div>

<script>
  let currentQty = 1;
  let cachedData = null;
  const WORKER_URL = 'https://bolly-cardio-api.ahariani2.workers.dev/';
  const ACUITY_ROOT = "https://bollycardiowitharushi.as.me/schedule/de43052c/appointment/";
  const MAPS_URL = "http://googleusercontent.com/maps.google.com/3";
  const TIME_SUFFIX = "T10%3A45%3A00-04%3A00";

  // 1. MODEL: Centralized Config
  const classConfigs = {
    'studio': { price: 12, appt: '80746158', cal: '12423814', loc: '📍 Creatives Rental Space', theme: 'Studio Session', color: 'var(--muted-magenta)', section: 'Atlanta Studio Classes' },
    'online': { price: 10, appt: '90839316', cal: '12423814', loc: '▶️ Live Online Class', theme: 'Bolly Cardio at Home', color: 'var(--online-orange)', section: 'Bolly Cardio At Home' }
  };

  const dateMap = {
    'mar29': { iso: '2026-03-29', display: 'Sunday, March 29', type: 'studio', hardSoldOut: true },
    'apr12': { iso: '2026-04-12', display: 'Sunday, April 12', type: 'studio' },
    'may03': { iso: '2026-05-03', display: 'Sunday, May 03', type: 'online' }
  };

  // 2. CONTROLLER: Routing Logic
  const urlParams = new URLSearchParams(window.location.search);
  const viewMode = urlParams.get('view'); // null, 'online', or 'studio'

  function openModal() { document.getElementById('infoModal').style.display = 'flex'; }
  function closeModal() { document.getElementById('infoModal').style.display = 'none'; }

  function renderSection(type, keys, data) {
    if (keys.length === 0) return;
    const config = classConfigs[type];
    const isOnline = type === 'online';
    const container = document.getElementById('class-list');

    // Section Header (Only show if viewing "Both")
    if (!viewMode) {
      const h = document.createElement('div');
      h.style = `margin: 40px 0 20px 0; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: ${config.color}; display: flex; align-items: center; justify-content: center; gap: 15px; opacity: 0.8;`;
      h.innerHTML = `<span style="flex-grow:1; height:1px; background:currentColor; opacity:0.2;"></span> ${config.section} <span style="flex-grow:1; height:1px; background:currentColor; opacity:0.2;"></span>`;
      container.appendChild(h);
    }

    keys.forEach(key => {
      const date = dateMap[key];
      const live = data[key];
      let spots = date.hardSoldOut ? 0 : (live ? parseInt(live.spots) : 99);
      const isSoldOut = spots <= 0;
      const theme = (live && live.theme) ? live.theme : config.theme;
      const url = `${ACUITY_ROOT}${config.appt}/calendar/${config.cal}/datetime/${date.iso}${TIME_SUFFIX}`;

      const card = document.createElement('div');
      card.className = `class-card ${isOnline ? 'online' : ''}`;
      card.innerHTML = `
        <div class="card-header"><span class="date-text">${date.display}</span></div>
        <div class="card-content">
          <div style="flex:1">
            <span class="theme-title">${theme} ${isOnline ? '<svg class="info-icon-svg" onclick="openModal()" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>' : ''}</span>
            <span class="info-line">10:45am (60 mins)</span>
            <span class="info-line"><b>$${(config.price * currentQty).toFixed(2)}</b></span>
            ${isOnline ? `<a href="javascript:void(0)" onclick="openModal()" class="location-line">${config.loc}</a>` : `<a href="${MAPS_URL}" target="_blank" class="location-line">${config.loc}</a>`}
          </div>
          <div style="text-align:center; min-width:130px;">
            <a href="${url}?quantity=${currentQty}" target="_blank" class="book-btn ${isSoldOut ? 'sold-out' : ''}">${isSoldOut ? 'SOLD OUT' : 'BOOK'}</a>
            <div class="label-container">${(!isOnline && spots <= 45) ? `<span class="spots-label">${isSoldOut ? 'No spots' : spots + ' left!'}</span>` : ''}</div>
          </div>
        </div>`;
      container.appendChild(card);
    });
  }

  function renderClasses(data) {
    cachedData = data;
    const container = document.getElementById('class-list');
    container.innerHTML = '';
    
    if (viewMode === 'online') {
        document.getElementById('stepper-ui').style.background = 'var(--online-orange)';
        renderSection('online', Object.keys(dateMap).filter(k => dateMap[k].type === 'online'), data);
    } else if (viewMode === 'studio') {
        renderSection('studio', Object.keys(dateMap).filter(k => dateMap[k].type === 'studio'), data);
    } else {
        renderSection('studio', Object.keys(dateMap).filter(k => dateMap[k].type === 'studio'), data);
        renderSection('online', Object.keys(dateMap).filter(k => dateMap[k].type === 'online'), data);
    }
    window.parent.postMessage({ type: 'resize', height: document.body.scrollHeight }, '*');
  }

  function changeQty(d) { currentQty = Math.max(1, Math.min(15, currentQty + d)); document.getElementById('qty-val').innerText = currentQty; if (cachedData) renderClasses(cachedData); }
  fetch(`${WORKER_URL}?t=${Date.now()}`).then(r => r.json()).then(renderClasses).catch(() => renderClasses({}));
</script>
