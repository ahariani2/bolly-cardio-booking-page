<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  /* 1. Global Reset & Layout */
  body, html { margin: 0; padding: 0; overflow: hidden; background: transparent; min-height: 500px; }
  
  :root {
    --bg-white: #ffffff;
    --white: #ffffff;
    --online-orange: #ff8c42;
    --online-bg: #fffbf7;
    --online-header: #ffe8d6;
  }

  .bolly-hub {
    font-family: 'Quicksand', sans-serif;
    max-width: 550px;
    margin: 0 auto;
    text-align: center;
    background-color: var(--bg-white);
    padding: 20px 20px 100px 20px; 
    border-radius: 20px;
  }

  @media (max-width: 480px) {
    .bolly-hub { padding: 15px 8px 100px 8px; }
    .card-content { padding: 15px 10px; }
  }

  .hub-header h2 { font-size: 1.8rem; margin-bottom: 8px; font-weight: 700; color: #333; }
  .qty-label { font-size: 0.9rem; font-weight: 700; margin-right: 10px; color: #333; }
  .stepper-container { display: flex; align-items: center; justify-content: center; margin-bottom: 30px; }
  .stepper {
    display: flex; align-items: center; background: var(--online-orange);
    padding: 4px 6px; border-radius: 50px; color: white; gap: 6px;
  }
  .step-btn { background: none; border: none; color: white; font-size: 1rem; cursor: pointer; }

  /* Online Card Styling */
  .class-card {
    background: var(--online-bg); border-radius: 12px; margin-bottom: 25px;
    overflow: hidden; border: 1px solid var(--online-header);
    box-shadow: 0 4px 12px rgba(166, 81, 29, 0.05);
    text-align: left;
  }
  .card-header { background-color: var(--online-header); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
  .card-header .date-text { color: #a6511d; font-weight: 700; font-size: 1.1rem; }
  .card-content { display: flex; padding: 20px; justify-content: space-between; align-items: center; }
  
  .theme-title { color: var(--online-orange); font-weight: 700; text-transform: uppercase; font-size: 0.85rem; display: block; margin-bottom: 8px; }
  .info-line { font-size: 0.9rem; color: #444; margin-bottom: 4px; display: block; }
  
  .location-line { 
    font-size: 0.85rem; color: #666; margin-top: 8px; display: block; 
    text-decoration: none; cursor: pointer; transition: 0.2s;
  }
  .location-line:hover { color: var(--online-orange); text-decoration: underline; }

  .info-icon-svg { 
    width: 18px; height: 18px; cursor: pointer; fill: var(--online-orange); 
    vertical-align: middle; margin-left: 6px; transition: transform 0.2s;
  }

  .book-btn {
    background: var(--online-orange); color: white !important;
    text-decoration: none; padding: 10px 18px; border-radius: 4px;
    font-weight: 700; font-size: 1rem; text-transform: uppercase; 
    transition: 0.2s; white-space: nowrap; 
  }
  .book-btn.sold-out { 
    background: #fff3eb !important; color: #eec4a8 !important; 
    pointer-events: none; border: 1px solid #ffe8d6; 
  }

  /* Modal & Youtube CTA */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-content { background: white; width: 90%; max-width: 480px; border-radius: 20px; padding: 30px; position: relative; font-family: 'Quicksand', sans-serif; }
  .modal-close { position: absolute; top: 15px; right: 20px; font-size: 1.8rem; cursor: pointer; color: #bbb; }
  .modal-header { color: var(--online-orange); font-weight: 700; font-size: 1.2rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
  .modal-img { width: 100%; border-radius: 12px; margin-bottom: 20px; display: block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  .youtube-cta { font-size: 0.85rem; color: #666; margin-top: 35px; line-height: 1.5; }
  .youtube-cta a { color: var(--online-orange); font-weight: 700; text-decoration: none; border-bottom: 1px solid var(--online-header); }
</style>

<div class="bolly-hub">
  <div class="hub-header">
    <h2>Bolly Cardio At Home</h2>
    <div class="stepper-container">
      <span class="qty-label">Quantity</span>
      <div class="stepper">
        <button class="step-btn" onclick="changeQty(-1)">−</button>
        <span id="qty-val">1</span>
        <button class="step-btn" onclick="changeQty(1)">+</button>
      </div>
    </div>
  </div>
  <div id="class-list"></div>
  <div class="youtube-cta">
    Can't wait? Try our <a href="https://www.youtube.com/watch?v=_2mkL_mWItA&utm_source=online_hub" target="_blank">10-min YouTube workout</a> now!
  </div>
</div>

<div id="infoModal" class="modal-overlay" onclick="closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <span class="modal-close" onclick="closeModal()">×</span>
    <div class="modal-header">
      <svg class="info-icon-svg" style="margin-left:0; margin-right:4px;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg> 
      Class Details
    </div>
    <div class="modal-body" style="text-align:left;">
      <p><b>Location:</b> 100% Virtual (YouTube Live)</p>
      <a href="https://www.youtube.com/watch?v=_2mkL_mWItA" target="_blank"><img src="https://lh3.googleusercontent.com/d/1pZ_U6Tf6fZW954vLxZ7k0RRDn_veS91F" class="modal-img" alt="Online Class Preview"></a>
      <p>Interactive, high-energy sessions you can join from anywhere in the world!</p>
    </div>
  </div>
</div>

<script>
  let currentQty = 1;
  let cachedData = null;
  const WORKER_URL = 'https://bolly-cardio-api.ahariani2.workers.dev/';
  const ACUITY_ROOT = "https://bollycardiowitharushi.as.me/schedule/de43052c/appointment/";
  const TIME_SUFFIX = "T10%3A45%3A00-04%3A00";

  const classConfigs = {
    'online': {
      price: 10.00,
      appointmentId: '90839316',
      calendarId: '12423814',
      locationLabel: '▶️ Live Online Class',
      defaultTheme: 'Bolly Cardio at Home'
    }
  };

  const dateMap = {
    'may03': { display: 'Sunday, May 03, 2026', iso: '2026-05-03', type: 'online' }
  };

  function openModal() { document.getElementById('infoModal').style.display = 'flex'; }
  function closeModal() { document.getElementById('infoModal').style.display = 'none'; }

  function getWeeksAway(dateKey) {
    const diffDays = Math.ceil((new Date(dateMap[dateKey].iso + 'T00:00:00') - new Date().setHours(0,0,0,0)) / (1000 * 60 * 60 * 24));
    if (diffDays === 0) return "Today!";
    if (diffDays < 7) return `In ${diffDays} days`;
    return `In ${Math.ceil(diffDays / 7)} weeks`;
  }

  function renderClasses(data) {
    cachedData = data;
    const container = document.getElementById('class-list');
    container.innerHTML = '';

    // FILTER: Only show 'online' types
    const onlineKeys = Object.keys(dateMap).filter(key => dateMap[key].type === 'online');

    onlineKeys.forEach(key => {
      const dateInfo = dateMap[key];
      const config = classConfigs['online'];
      const classData = data[key];
      
      let spots = dateInfo.hardSoldOut ? 0 : 99;
      if (classData) spots = parseInt(classData.spots);

      const theme = (classData && classData.theme) ? classData.theme : config.defaultTheme;
      const isSoldOut = spots <= 0;
      const targetUrl = `${ACUITY_ROOT}${config.appointmentId}/calendar/${config.calendarId}/datetime/${dateInfo.iso}${TIME_SUFFIX}`;

      const card = document.createElement('div');
      card.className = 'class-card';
      card.innerHTML = `
        <div class="card-header">
          <span class="date-text">${dateInfo.display}</span>
          <span style="font-size:0.75rem; font-weight:700; color:#a6511d; opacity:0.8;">${getWeeksAway(key)}</span>
        </div>
        <div class="card-content">
          <div style="flex:1;">
            <span class="theme-title">${theme} <svg class="info-icon-svg" onclick="openModal()" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg></span>
            <span class="info-line">10:45am (60 mins)</span>
            <span class="info-line"><b>$${(config.price * currentQty).toFixed(2)}</b></span>
            <a href="javascript:void(0)" onclick="openModal()" class="location-line">${config.locationLabel}</a>
          </div>
          <div style="text-align:center; min-width:130px;">
            <a href="${targetUrl}?quantity=${currentQty}" target="_blank" class="book-btn ${isSoldOut ? 'sold-out' : ''}">
               ${isSoldOut ? 'SOLD OUT' : 'BOOK'}
            </a>
          </div>
        </div>
      `;
      container.appendChild(card);
    });

    window.parent.postMessage({ type: 'resize', height: document.body.scrollHeight }, '*');
  }

  function changeQty(delta) {
    const newVal = currentQty + delta;
    if (newVal >= 1 && newVal <= 15) {
      currentQty = newVal;
      document.getElementById('qty-val').innerText = currentQty;
      if (cachedData) renderClasses(cachedData);
    }
  }

  fetch(`${WORKER_URL}?t=${Date.now()}`).then(r => r.json()).then(renderClasses).catch(() => renderClasses({}));
</script>
