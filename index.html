<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-pink: #fff6fb;
    --dark-magenta: #8b004b;
    --header-pink: #ffdef0;
    --bright-pink: #e4007c;
    --muted-magenta: #9f2c6b;
    --white: #ffffff;
  }

  .bolly-hub {
    font-family: 'Quicksand', sans-serif;
    max-width: 550px;
    margin: 0 auto;
    text-align: center;
    background-color: var(--bg-pink);
    padding: 20px;
    border-radius: 20px;
  }

  /* STEP 3 FIX: Reduce padding on mobile */
  @media (max-width: 480px) {
    .bolly-hub { padding: 15px 8px; }
    .card-content { padding: 15px 10px; }
    .card-header { padding: 10px 15px; }
  }

  .hub-header h2 { font-size: 1.8rem; margin-bottom: 8px; font-weight: 700; color: #333; }
  
  .qty-label { font-size: 0.9rem; font-weight: 700; margin-right: 10px; color: #333; }
  .stepper-container { display: flex; align-items: center; justify-content: center; margin-bottom: 30px; }
  .stepper {
    display: flex;
    align-items: center;
    background: var(--bright-pink);
    padding: 4px 6px;
    border-radius: 50px;
    color: white;
    font-weight: 700;
    gap: 6px;
  }
  .step-btn {
    background: none; border: none; color: white;
    font-size: 1rem; cursor: pointer; display: flex; align-items: center;
  }

  .class-card {
    background: var(--white);
    border-radius: 12px;
    margin-bottom: 25px;
    overflow: hidden;
    border: 1px solid var(--header-pink);
    box-shadow: 0 4px 12px rgba(139, 0, 75, 0.05);
  }

  .card-header {
    background-color: var(--header-pink);
    padding: 12px 20px;
    text-align: left;
  }
  .card-header .date-text {
    color: var(--dark-magenta);
    font-weight: 700;
    font-size: 1.1rem;
  }

  .card-content {
    display: flex;
    padding: 20px;
    text-align: left;
    justify-content: space-between;
    align-items: center; /* Vertically aligns left and right columns */
  }

  .details-col { flex: 1; }

  /* STEP 3 FIX: Center items horizontally inside the column */
  .action-col { 
    text-align: center; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    min-width: 120px; /* Ensures space for the button/label */
  }

  .theme-title { color: var(--bright-pink); font-weight: 700; text-transform: uppercase; font-size: 0.85rem; display: block; margin-bottom: 8px; }
  .info-line { font-size: 0.9rem; color: #444; margin-bottom: 4px; display: block; }
  .location-line { font-size: 0.85rem; color: #666; margin-top: 8px; display: block; margin-bottom: 8px; }

  .book-btn {
    background: var(--muted-magenta);
    color: white !important;
    text-decoration: none;
    padding: 10px 24px;
    border-radius: 4px;
    font-weight: 700;
    font-size: 1rem;
    text-transform: uppercase;
    transition: background 0.2s;
    white-space: nowrap; /* Keeps BOOK on one line */
  }
  .book-btn:hover { background: var(--bright-pink); }
  .book-btn.sold-out { background: #ccc; cursor: not-allowed; pointer-events: none; }

  .spots-label { font-size: 0.75rem; font-weight: 600; margin-top: 8px; color: var(--bright-pink); }
</style>

<div class="bolly-hub">
  <div class="hub-header">
    <h2>Bolly Cardio with Arushi</h2>
    <div class="stepper-container">
      <span class="qty-label">Quantity</span>
      <div class="stepper">
        <button class="step-btn" onclick="changeQty(-1)">−</button>
        <span id="qty-val">1</span>
        <button class="step-btn" onclick="changeQty(1)">+</button>
      </div>
    </div>
  </div>

  <div id="class-list" class="class-list">
    <p style="color:var(--dark-magenta); font-weight:600; padding:20px;">Loading latest classes...</p>
  </div>
</div>

<style>
  /* NEW: Dedicated Sold Out / Disabled Styling */
  .book-btn.sold-out { 
    background: #444 !important; /* Darker, clearly inactive */
    color: #888 !important;
    cursor: not-allowed; 
    pointer-events: none;
    opacity: 0.8;
  }
  
  /* Centering the sync offline message */
  .fallback-msg {
    font-size: 0.7rem;
    color: #999;
    margin-top: 8px;
    font-style: italic;
  }
</style>

<script>
  let currentQty = 1;
  let cachedData = null; // Store data so we don't fetch on every qty change
  const WORKER_URL = 'https://bolly-cardio-api.ahariani2.workers.dev/';
  
  const ACUITY_BASE = "https://bollycardiowitharushi.as.me/schedule/de43052c/appointment/80746158/calendar/12423814/datetime/";
  const TIME_SUFFIX = "T10%3A45%3A00-04%3A00";

  const dateMap = {
    'mar15': { display: 'Sunday, March 15, 2026', iso: '2026-03-15' },
    'mar29': { display: 'Sunday, March 29, 2026', iso: '2026-03-29' },
    'apr12': { display: 'Sunday, April 12, 2026', iso: '2026-04-12' }
  };

  function getWeeksAway(dateKey) {
    const classDate = new Date(dateMap[dateKey].iso);
    const today = new Date();
    const diff = classDate - today;
    const weeks = Math.ceil(diff / (1000 * 60 * 60 * 24 * 7));
    return weeks > 0 ? `In ${weeks} weeks` : "Soon!";
  }

  function renderClasses(data) {
    cachedData = data; 
    const container = document.getElementById('class-list');
    container.innerHTML = ''; 

    // We use dateMap as the primary source so cards show even if sync fails
    Object.keys(dateMap).forEach(key => {
      const classInfo = data[key];
      const hasLiveData = !!classInfo;
      const spots = hasLiveData ? parseInt(classInfo.spots) : 99; 
      const theme = (classInfo && classInfo.theme) ? classInfo.theme : "";
      
      const isSoldOut = spots <= 0;
      const isNotEnoughSpots = currentQty > spots;
      const targetUrl = `${ACUITY_BASE}${dateMap[key].iso}${TIME_SUFFIX}`;

      const card = document.createElement('div');
      card.className = 'class-card';
      card.innerHTML = `
        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
          <span class="date-text">${dateMap[key].display}</span>
          <span style="font-size: 0.75rem; font-weight: 700; color: var(--muted-magenta); opacity: 0.8;">${getWeeksAway(key)}</span>
        </div>
        <div class="card-content">
          <div class="details-col">
            ${theme ? `<span class="theme-title">${theme}</span>` : ''}
            <span class="info-line">10:45am (60 mins)</span>
            <span class="info-line price-display">$${(12 * currentQty).toFixed(2)}</span>
            <span class="location-line">📍 Creatives Rental Space</span>
          </div>
          <div class="action-col">
            <a href="${targetUrl}?quantity=${currentQty}" 
               target="_blank" rel="noopener"
               class="book-btn ${isSoldOut || isNotEnoughSpots ? 'sold-out' : ''}" 
               id="btn-${key}">
               ${isSoldOut ? 'SOLD OUT' : (isNotEnoughSpots ? 'LIMIT REACHED' : 'BOOK')}
            </a>
            <div class="label-container">
              ${hasLiveData ? `
                <span class="spots-label" style="color: ${spots <= 10 ? 'var(--bright-pink)' : 'var(--muted-magenta)'}">
                  ${isSoldOut ? 'No spots remaining' : (spots <= 10 ? `Only ${spots} left!` : `${spots} spots left`)}
                </span>
              ` : '<span class="fallback-msg">Checking availability...</span>'}
            </div>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function changeQty(delta) {
    const newVal = currentQty + delta;
    if (newVal >= 1 && newVal <= 15) {
      currentQty = newVal;
      document.getElementById('qty-val').innerText = currentQty;
      // Re-render from cache instead of hitting the network again
      if (cachedData) renderClasses(cachedData);
    }
  }

  function fetchAndRender() {
    fetch(WORKER_URL)
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(renderClasses)
      .catch(() => {
        console.warn("Using offline fallback");
        renderClasses({}); // Still shows cards!
      });
  }

  fetchAndRender();
</script>
