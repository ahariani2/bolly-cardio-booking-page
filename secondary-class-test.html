<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  /* 1. Global Reset & Layout - SCROLL FIX */
  * { font-family: 'Quicksand', sans-serif !important; }
  body, html { margin: 0; padding: 0; overflow: visible; background: transparent; }
  
  :root {
    --bg-white: #ffffff;
    --dark-magenta: #8b004b;
    --header-pink: #ffdef0;
    --bright-pink: #e4007c;
    --muted-magenta: #9f2c6b;
    --online-orange: #ff8c42;
    --online-bg: #fffbf7;
    --online-header: #ffe8d6;
  }

  .bolly-hub {
    max-width: 550px;
    margin: 0 auto;
    text-align: center;
    background-color: var(--bg-white);
    padding: 20px 20px 100px 20px; 
    border-radius: 20px;
  }

  /* 2. Card Components */
  .class-card {
    background: #ffffff; border-radius: 12px; margin-bottom: 25px;
    overflow: hidden; border: 1px solid var(--header-pink);
    box-shadow: 0 4px 12px rgba(139, 0, 75, 0.05);
    transition: opacity 0.3s ease;
  }
  .class-card.online { background: var(--online-bg); border-color: var(--online-header); }
  .class-card.online .card-header { background-color: var(--online-header); }
  .class-card.online .date-text { color: #a6511d; }

  .card-header { background-color: var(--header-pink); padding: 12px 20px; text-align: left; }
  .card-header .date-text { color: var(--dark-magenta); font-weight: 700; font-size: 1.1rem; }
  
  .card-content { display: flex; padding: 20px; text-align: left; justify-content: space-between; align-items: center; }
  .details-col { flex: 1; }
  .action-col { text-align: center; display: flex; flex-direction: column; align-items: center; min-width: 130px; }

  .theme-title { color: var(--bright-pink); font-weight: 700; text-transform: uppercase; font-size: 0.85rem; display: block; margin-bottom: 8px; }
  .class-card.online .theme-title { color: var(--online-orange); }
  
  .info-line { font-size: 0.9rem; color: #444; margin-bottom: 4px; display: block; }
  .book-btn {
    background: var(--muted-magenta); color: white !important;
    text-decoration: none; padding: 10px 18px; border-radius: 4px;
    font-weight: 700; font-size: 1rem; text-transform: uppercase; 
    transition: 0.2s; white-space: nowrap; 
  }
  .class-card.online .book-btn { background: var(--online-orange); }
  .book-btn.sold-out { background: #fdf0f7 !important; color: #d4a5bc !important; pointer-events: none; opacity: 0.8; }

  .spots-label { font-size: 0.75rem; font-weight: 600; margin-top: 8px; color: var(--bright-pink); display: block; }

  /* 3. Modal & Video */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-content { background: white; width: 90%; max-width: 480px; border-radius: 20px; padding: 30px; position: relative; text-align: left; }
  .modal-close { position: absolute; top: 15px; right: 20px; font-size: 1.8rem; cursor: pointer; color: #bbb; }
  .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; margin-bottom: 20px; }
  .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  
  .stepper-container { display: flex; align-items: center; justify-content: center; margin-bottom: 30px; }
  .stepper { display: flex; align-items: center; background: var(--bright-pink); padding: 4px 6px; border-radius: 50px; color: white; gap: 6px; }
  .step-btn { background: none; border: none; color: white; font-size: 1rem; cursor: pointer; }
</style>

<div class="bolly-hub">
  <div class="hub-header">
    <h2 style="font-size: 1.8rem; margin-bottom: 8px; font-weight: 700; color: #333;">Bolly Cardio with Arushi</h2>
    <div class="stepper-container">
      <span style="font-size: 0.9rem; font-weight: 700; margin-right: 10px; color: #333;">Quantity</span>
      <div class="stepper">
        <button class="step-btn" onclick="changeQty(-1)">−</button>
        <span id="qty-val">1</span>
        <button class="step-btn" onclick="changeQty(1)">+</button>
      </div>
    </div>
  </div>
  <div id="class-list"></div>
</div>

<div id="infoModal" class="modal-overlay" onclick="closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <span class="modal-close" onclick="closeModal()">×</span>
    <div style="color:var(--online-orange); font-weight:700; font-size:1.2rem; margin-bottom:15px;">Online Class Details</div>
    <div class="video-container">
      <iframe src="https://www.youtube.com/embed/_2mkL_mWItA?rel=0" allowfullscreen></iframe>
    </div>
    <p style="font-size:0.9rem; color:#444;">Join us online! Link emailed 30 mins before class.</p>
  </div>
</div>

<script>
  let currentQty = 1;
  let cachedData = null;
  const WORKER_URL = 'https://bolly-cardio-api.ahariani2.workers.dev/';
  const ACUITY_ROOT = "https://bollycardiowitharushi.as.me/schedule/de43052c/appointment/";

  const classConfigs = {
    'studio': { price: 12, timeLabel: '<b>10:45am EST</b> (60 mins)', apptId: '80746158', calId: '12423814', theme: 'Studio Session', suffix: 'T10%3A45%3A00-04%3A00' },
    'studio_pm': { price: 12, timeLabel: '<b>1:45pm EST</b> (60 mins)', apptId: '80746158', calId: '12423814', theme: 'Item Songs Special (Session 2)', suffix: 'T13%3A45%3A00-04%3A00' },
    'online': { price: 10, timeLabel: '<b>11:00am EST</b> (50 mins)', apptId: '90839316', calId: '12423814', theme: 'Bolly Cardio at Home', suffix: 'T11%3A00%3A00-04%3A00' }
  };

  const dateMap = {
    'mar29': { display: 'Sunday, March 29, 2026', iso: '2026-03-29', type: 'studio', hardSoldOut: true },
    'apr12': { display: 'Sunday, April 12, 2026', iso: '2026-04-12', type: 'studio', hardSoldOut: true },
    'apr12_pm': { display: 'Sunday, April 12, 2026', iso: '2026-04-12', type: 'studio_pm' },
    'may03': { display: 'Sunday, May 03, 2026', iso: '2026-05-03', type: 'online' }
  };

  function openModal() { document.getElementById('infoModal').style.display = 'flex'; }
  function closeModal() { document.getElementById('infoModal').style.display = 'none'; }

  function getWeeksAway(key) {
    const diff = Math.ceil((new Date(dateMap[key].iso) - new Date().setHours(0,0,0,0)) / 86400000);
    return diff === 0 ? "Today!" : (diff < 7 ? `In ${diff} days` : `In ${Math.ceil(diff/7)} weeks`);
  }

  function renderSection(keys, title, isOnline) {
    if (keys.length === 0) return;
    const container = document.getElementById('class-list');
    const header = document.createElement('div');
    header.style = `margin: 40px 0 20px 0; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: ${isOnline ? 'var(--online-orange)' : 'var(--muted-magenta)'}; display: flex; align-items: center; justify-content: center; gap: 15px; opacity: 0.8;`;
    header.innerHTML = `<span style="flex-grow:1; height:1px; background:currentColor; opacity:0.2;"></span> ${title} <span style="flex-grow:1; height:1px; background:currentColor; opacity:0.2;"></span>`;
    container.appendChild(header);

    keys.forEach(key => {
      const date = dateMap[key];
      const config = classConfigs[date.type];
      const live = cachedData ? cachedData[key] : null;
      let spots = date.hardSoldOut ? 0 : (live ? parseInt(live.spots) : 99);
      
      const isSoldOut = spots <= 0;
      const theme = (live && live.theme) ? live.theme : config.theme;
      const url = `${ACUITY_ROOT}${config.apptId}/calendar/${config.calId}/datetime/${date.iso}${config.suffix}`;

      const card = document.createElement('div');
      card.className = `class-card ${isOnline ? 'online' : ''}`;
      card.innerHTML = `
        <div class="card-header"><span class="date-text">${date.display}</span></div>
        <div class="card-content">
          <div class="details-col">
            <span class="theme-title">${theme}</span>
            <span class="info-line">${config.timeLabel}</span>
            <span class="info-line"><b>$${(config.price * currentQty).toFixed(2)}</b></span>
          </div>
          <div class="action-col">
            <a href="${url}?quantity=${currentQty}" target="_blank" class="book-btn ${isSoldOut ? 'sold-out' : ''}">${isSoldOut ? 'SOLD OUT' : 'BOOK'}</a>
            <div class="label-container">${(key !== 'apr12_pm' && !isOnline && spots <= 45 && !isSoldOut) ? `<span class="spots-label">${spots} left!</span>` : ''}</div>
          </div>
        </div>`;
      container.appendChild(card);
    });
  }

  function renderClasses(data) {
    cachedData = data;
    const container = document.getElementById('class-list');
    container.innerHTML = '';
    renderSection(Object.keys(dateMap).filter(k => dateMap[k].type.startsWith('studio')), "Atlanta Studio Classes", false);
    renderSection(Object.keys(dateMap).filter(k => dateMap[k].type === 'online'), "Online Classes", true);
    
    setTimeout(() => {
      window.parent.postMessage({ type: 'resize', height: document.body.scrollHeight + 100 }, '*');
    }, 200);
  }

  function changeQty(d) { currentQty = Math.max(1, Math.min(15, currentQty + d)); document.getElementById('qty-val').innerText = currentQty; if (cachedData) renderClasses(cachedData); }
  fetch(`${WORKER_URL}?t=${Date.now()}`).then(r => r.json()).then(renderClasses).catch(() => renderClasses({}));
</script>
