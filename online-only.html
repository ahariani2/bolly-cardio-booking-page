<style>
  /* 1. Global Reset & Minimal Layout for Embedding */
  body, html { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  
  :root {
    --white: #ffffff;
    --online-orange: #ff8c42;
    --online-bg: #fffbf7;
    --online-header: #ffe8d6;
  }

  .bolly-hub-stripped {
    font-family: 'Quicksand', sans-serif;
    max-width: 550px;
    margin: 0 auto;
    /* Removed padding so it aligns with your website's native columns */
    padding: 0; 
  }

  @media (max-width: 480px) {
    .card-content { padding: 15px 10px; }
    .card-header { padding: 10px 15px; }
  }

  /* 2. Online Card Styling */
  .class-card.online { 
    background: var(--online-bg); 
    border-radius: 12px; 
    overflow: hidden; 
    border: 1px solid var(--online-header);
    box-shadow: 0 4px 12px rgba(166, 81, 29, 0.05);
    text-align: left;
  }
  
  .card-header { background-color: var(--online-header); padding: 12px 20px; }
  .card-header .date-text { color: #a6511d; font-weight: 700; font-size: 1.1rem; }
  
  .card-content { display: flex; padding: 20px; justify-content: space-between; align-items: center; }
  .details-col { flex: 1; }
  .action-col { text-align: center; display: flex; flex-direction: column; align-items: center; min-width: 130px; }

  .theme-title { color: var(--online-orange); font-weight: 700; text-transform: uppercase; font-size: 0.85rem; display: block; margin-bottom: 8px; }
  .info-line { font-size: 0.9rem; color: #444; margin-bottom: 4px; display: block; }
  
  .location-line { 
    font-size: 0.85rem; color: #666; margin-top: 8px; display: block; 
    text-decoration: none; transition: 0.2s; cursor: pointer;
  }
  .location-line:hover { color: var(--online-orange); text-decoration: underline; }

  .info-icon-svg { 
    width: 18px; height: 18px; cursor: pointer; fill: var(--online-orange); 
    vertical-align: middle; margin-left: 6px; transition: transform 0.2s;
  }

  .book-btn {
    background: var(--online-orange); color: white !important;
    text-decoration: none; padding: 10px 18px; border-radius: 4px;
    font-weight: 700; font-size: 1rem; text-transform: uppercase; 
    transition: 0.2s; white-space: nowrap; 
  }
  .book-btn:hover { background: #e6762d; }
  .book-btn.sold-out { background: #fff3eb !important; color: #eec4a8 !important; pointer-events: none; }

  /* 3. Modal Styling (Preserved) */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000;
  }
  .modal-content {
    background: white; width: 90%; max-width: 480px; border-radius: 20px;
    padding: 30px; position: relative; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    font-family: 'Quicksand', sans-serif;
  }
  .modal-close { position: absolute; top: 15px; right: 20px; font-size: 1.8rem; cursor: pointer; color: #bbb; }
  .modal-header { color: var(--online-orange); font-weight: 700; font-size: 1.2rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
  .modal-img { width: 100%; border-radius: 12px; margin-bottom: 20px; display: block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
</style>

<div class="bolly-hub-stripped">
  <div id="class-list">
    </div>
</div>

<div id="infoModal" class="modal-overlay" onclick="closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <span class="modal-close" onclick="closeModal()">×</span>
    <div class="modal-header">
      <svg class="info-icon-svg" style="margin-left:0; margin-right:4px;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg> 
      Online Classes
    </div>
    <div class="modal-body">
      <p>Online Class Details</p>
      <p><b>Location:</b> 100% Virtual (Join from anywhere!)</p>
      <p><b>Platform:</b> Private Link (Emailed to you before class)</p>
      <a href="https://www.youtube.com/watch?v=_2mkL_mWItA" target="_blank"><img src="https://lh3.googleusercontent.com/d/1pZ_U6Tf6fZW954vLxZ7k0RRDn_veS91F" class="modal-img" alt="Bolly Cardio at Home"></a>
      <p>Experience the high-energy vibe from home! Our online classes are designed for all levels.</p>
    </div>
  </div>
</div>

<script>
  // Stripped down to Online Only
  let cachedData = null;
  const WORKER_URL = 'https://bolly-cardio-api.ahariani2.workers.dev/';
  const ACUITY_ROOT = "https://bollycardiowitharushi.as.me/schedule/de43052c/appointment/";

  const config = {
      price: 10.00,
      timeLabel: '<b>11:00am EST</b> (50 mins)',
      appointmentId: '90839316',
      calendarId: '12423814',
      locationLabel: '▶️ Online Class',
      defaultTheme: 'Bolly Cardio at Home',
      timeSuffix: 'T11%3A00%3A00-04%3A00'
  };

  const dateMap = {
    'may03': { display: 'Sunday, May 03, 2026', iso: '2026-05-03' }
  };

  function openModal() { document.getElementById('infoModal').style.display = 'flex'; }
  function closeModal() { document.getElementById('infoModal').style.display = 'none'; }

  function renderCard(data) {
    const key = 'may03';
    const dateInfo = dateMap[key];
    const liveData = data[key];
    const container = document.getElementById('class-list');
    
    let spots = liveData ? parseInt(liveData.spots) : 99;
    const isSoldOut = spots <= 0;
    const theme = (liveData && liveData.theme) ? liveData.theme : config.defaultTheme;
    const targetUrl = `${ACUITY_ROOT}${config.appointmentId}/calendar/${config.calendarId}/datetime/${dateInfo.iso}${config.timeSuffix}`;

    container.innerHTML = `
      <div class="class-card online">
        <div class="card-header"><span class="date-text">${dateInfo.display}</span></div>
        <div class="card-content">
          <div class="details-col">
            <span class="theme-title">
              ${theme} <svg class="info-icon-svg" onclick="openModal()" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            </span>
            <span class="info-line">${config.timeLabel}</span>
            <span class="info-line"><b>$${config.price.toFixed(2)}</b></span>
            <a href="javascript:void(0)" onclick="openModal()" class="location-line">${config.locationLabel}</a>
          </div>
          <div class="action-col">
            <a href="${targetUrl}?quantity=1" target="_blank" class="book-btn ${isSoldOut ? 'sold-out' : ''}">
               ${isSoldOut ? 'SOLD OUT' : 'BOOK'}
            </a>
          </div>
        </div>
      </div>
    `;

    // Resize iFrame to fit exactly one card
    window.parent.postMessage({ type: 'resize', height: document.body.scrollHeight }, '*');
  }

  fetch(`${WORKER_URL}?t=${Date.now()}`).then(r => r.json()).then(renderCard).catch(() => renderCard({}));
</script>
